;Вот теперь всё сошлось — и воровать было некому. Смотрите на первую строку падения:
;text
;Executing task: ...platformio.exe run        ← БЕЗ -e !
;Processing esp32-s3-kit ...
;PLATFORM: Espressif 32 (8.0.0)
;PACKAGES: framework-arduinoespressif32 @ 4.30312.261116 (3.3.12)
;Что на самом деле произошло
;Иконка запустила сборку не того окружения. platformio.exe run без -e собирает окружение по умолчанию — а у вас в dual-core проекте это esp32-s3-kit, не a2dp_sink. Дальше цепочка детерминированная, никакой порчи:

;Env esp32-s3-kit требует ядро 3.3.12 → PIO честно ставит его в общую папку ~\.platformio\packages;
;Ваша «чинь-команда» (pkg install -e a2dp_sink) видит: нужно 3.3.9, а стоит 3.3.12 → перекачивает 3.3.9;
;Снова иконка → снова 3.3.12 → у a2dp_sink «не та версия» → TypeError.
;Ничего не «портится» — два окружения в одном проекте требуют разные версии одного и того же пакета, а папка пакетов общая на всю систему. Кто последний собирался — тот и победил. Это же объясняет «полтергейст» с самого начала: не антивирус, не чистильщики, не VSCode — а конфликт версий между вашими env.

;Бонус-улика в том же логе: сборка S3-kit заодно компилировала src/a2dp/main.cpp (значит, фильтр у S3-окружения захватывает папку a2dp) и упала на отсутствии AudioTools.h — библиотеки для этого env не ставились. Всё последовательно.

;Лечение — сделать иконки правильными
;Пока идёт работа над BT, укажите PIO собирать по умолчанию то, что нужно:

;ini
;[platformio]
;default_envs = a2dp_sink
;После этого иконки IDE будут работать с a2dp_sink, и конфликт версий на время работы над синком исчезнет. Возвращаетесь к yoRadio — меняете на default_envs = esp32-s3-kit.

;Стратегическое решение — убрать конфликт версий навсегда
;Два env с разными версиями ядра в одном проекте — это мина: будете всегда спотыкаться при переключении. Варианты:

;Вариант А (проверить, потом решить): попробовать a2dp_sink на ядре 3.3.12 — том же, что у yoRadio. Если A2DP-библиотека на нём работает (скорее всего да, ядро свежее), выравниваем оба env на одну версию, и подмены умирают как класс. Тест дешёвый: убрать platform_packages из a2dp-секции, запустить, послушать звук. Не заработает — возвращаем пин 3.3.9.

;Вариант Б (статус-кво): оставить как есть и жить по правилу «a2dp — только терминалом с -e a2dp_sink». Работает, но каждое переключение = ритуал переустановки ядра (~минута на перекачку).

;Моя рекомендация: сначала добейте контрольный тест синка (телефон, счётчик ~176 400 Б/с) на текущем рабочем 3.3.9 — не меняйте переменные, пока идёт проверка звука. Когда звук подтверждён — сделайте Вариант А, и проблема исчезнет целиком.

;Кстати, теперь понятно, почему pkg list -e a2dp_sink неделю назад показывал битую картину — вы поймали папку в момент, когда S3-сборка уже успела её перезаписать. Все улики за два дня сходятся в одну историю 🕵️

;Текущее состояние, кстати, уже правильное: в папке лежит 3.3.12, поэтому следующая сборка a2dp_sink терминалом либо сама перекачает 3.3.9, либо — с добавленным default_envs — вообще перестанет с этим сталкиваться.

