[env:wrover_a2dp]
platform = espressif32@~8.0.0
board = esp-wrover-kit
framework = arduino
upload_port = COM4
monitor_port = COM4
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -I../../config
lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git
